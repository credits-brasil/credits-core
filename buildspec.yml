
version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 22
    commands:
      - echo "Instalando dependências..."
      - npm ci

  # pre_build:
  #   commands:
  #     - npm run test:ci

  build:
    commands:
      - echo "Compilando aplicação TypeScript..."
      - npm run build
      - echo "Validando arquivo principal..."
      - test -f dist/server.js

  post_build:
    commands:
      - echo "Build concluído com sucesso."
      - echo "Preparando artefatos para o Elastic Beanstalk..."

artifacts:
  base-directory: .
  files:
    - 'dist/**/*'
    - 'prisma/**/*'
    - 'package.json'
    - 'package-lock.json'
    - 'Procfile'
  discard-paths: no
